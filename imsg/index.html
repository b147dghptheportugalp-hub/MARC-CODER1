<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escord - Web Chat UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: radial-gradient(circle at top, #262b3d 0%, #181b2a 35%, #0d0f17 100%);
            color: #ecf2ff;
        }

        .sidebar {
            width: 260px;
            background: rgba(20, 22, 31, 0.96);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.06);
            box-shadow: inset -1px 0 0 rgba(255,255,255,0.03);
        }

        .sidebar-header {
            padding: 18px 18px 16px;
            font-weight: 800;
            font-size: 1.15rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #7aa2ff;
            letter-spacing: 0.02em;
        }

        .channel-list {
            list-style: none;
            padding: 12px 10px;
            overflow-y: auto;
        }

        .channel {
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #dfe6ff;
            font-weight: 600;
        }

        .channel:hover, .channel.active {
            background: linear-gradient(135deg, rgba(122,162,255,0.18), rgba(122,162,255,0.08));
            color: #ffffff;
            box-shadow: inset 0 0 0 1px rgba(122,162,255,0.18);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(16,18,25,0.92), rgba(9,10,14,0.96));
        }

        .chat-header {
            padding: 16px 20px;
            background: rgba(28, 31, 40, 0.96);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .chat-header h2 {
            font-size: 1.15rem;
            letter-spacing: 0.02em;
        }

        .chat-actions {
            display: flex;
            gap: 10px;
        }

        .chat-actions button {
            background: rgba(122,162,255,0.12);
            border: 1px solid rgba(122,162,255,0.3);
            color: #dfeaff;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 700;
        }

        .chat-actions button:hover {
            background: rgba(122,162,255,0.2);
        }

        .messages {
            flex: 1;
            padding: 18px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: linear-gradient(rgba(255,255,255,0.015), rgba(255,255,255,0.015));
        }

        .message {
            max-width: 72%;
            padding: 11px 14px;
            border-radius: 14px;
            line-height: 1.5;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            word-break: break-word;
        }

        .message.received {
            background: rgba(52, 58, 70, 0.96);
            align-self: flex-start;
            border-top-left-radius: 6px;
        }

        .message.sent {
            background: linear-gradient(135deg, #3f9cff, #4c6fff);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 6px;
        }

        .timestamp {
            font-size: 0.72rem;
            color: rgba(236,242,255,0.7);
            display: block;
            text-align: right;
            margin-top: 6px;
        }

        .input-area {
            padding: 14px 18px 18px;
            background: rgba(20,22,31,0.94);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background: linear-gradient(135deg, #4b8dff, #4c6fff);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.15s ease;
        }

        .send-btn:hover {
            transform: translateY(-1px);
        }

        .auth-screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8, 10, 16, 0.96); }
        .auth-box { width: min(92vw, 390px); padding: 30px; background: rgba(31, 35, 47, 0.98); border: 1px solid rgba(122,162,255,0.25); border-radius: 18px; box-shadow: 0 18px 42px rgba(0,0,0,0.35); }
        .auth-box h1 { color: #7aa2ff; margin-bottom: 8px; font-size: 2rem; }
        .auth-box p, .auth-error { margin: 10px 0 18px; color: #b9c4e6; }
        .auth-box input, .auth-box button, .channel-add input { width: 100%; padding: 12px; margin-top: 10px; border: 0; border-radius: 10px; }
        .auth-box input, .channel-add input { background: rgba(255,255,255,0.05); color: white; outline: none; border: 1px solid rgba(255,255,255,0.08); }
        .auth-box button, .channel-add button { background: linear-gradient(135deg, #4b8dff, #4c6fff); color: white; cursor: pointer; font-weight: 700; }
        .auth-switch { background: transparent !important; color: #7aa2ff !important; border: 1px solid rgba(122,162,255,0.35) !important; }
        .auth-error { color: #ff8e8e; min-height: 18px; }
        .channel-add { padding: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
        .channel-add button { padding: 8px; }
        .online-users { padding: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .online-users h3 { font-size: .8rem; color: #b9c4e6; margin-bottom: 8px; }
        .online-user { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 8px 0; color: #ecf2ff; }
        .online-user button { border: 0; background: transparent; color: #7aa2ff; cursor: pointer; }
        .social-tools { padding: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .social-tools h3 { font-size: .8rem; color: #b9c4e6; margin-bottom: 8px; }
        .social-tools form { display: grid; gap: 6px; margin-bottom: 12px; }
        .social-tools input, .social-tools button { width: 100%; padding: 8px; border: 0; border-radius: 8px; }
        .social-tools input { background: rgba(255,255,255,0.05); color: white; outline: none; border: 1px solid rgba(255,255,255,0.08); }
        .social-tools button { background: linear-gradient(135deg, #4b8dff, #4c6fff); color: white; cursor: pointer; font-weight: 700; }
        .friend-list { display: flex; flex-wrap: wrap; gap: 6px; color: #ecf2ff; font-size: .8rem; }
        .friend-chip { padding: 5px 8px; background: rgba(122,162,255,0.12); border: 1px solid rgba(122,162,255,0.2); border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7aa2ff; display: inline-block; }
        .status-dot.offline { background: #7c869d; }
        .group-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .group-item { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; color: #edf4ff; }
        .group-item.active { background: rgba(122,162,255,0.12); border-color: rgba(122,162,255,0.2); }
        .call-panel { position: fixed; right: 26px; bottom: 26px; z-index: 6; padding: 16px; background: rgba(18,22,31,0.96); border: 1px solid rgba(122,162,255,0.4); border-radius: 18px; box-shadow: 0 18px 42px rgba(0,0,0,0.35); display: none; }
        .call-panel video { width: 230px; max-width: 40vw; background: #111; display: block; margin-bottom: 8px; border-radius: 12px; }
        .call-panel button { padding: 9px 14px; border: 0; background: #e74c3c; color: white; cursor: pointer; border-radius: 10px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="auth-screen" id="authScreen">
        <form class="auth-box" id="authForm">
            <h1>DisApp</h1>
            <p id="authSubtitle">Log in to continue</p>
            <input id="usernameInput" required minlength="3" maxlength="24" placeholder="Username" autocomplete="username">
            <input id="passwordInput" required minlength="6" type="password" placeholder="Password" autocomplete="current-password">
            <div class="auth-error" id="authError"></div>
            <button type="submit" id="authSubmit">Log in</button>
            <button type="button" class="auth-switch" id="authSwitch">Create a new account</button>
        </form>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            DisApp Public
        </div>
        <ul class="channel-list">
            <li class="channel active" data-channel="general-chat"># general-chat</li>
            <li class="channel" data-channel="coding-help"># coding-help</li>
            <li class="channel" data-channel="voice-calls"># voice-calls</li>
        </ul>
        <div class="channel-add"><input id="newChannelInput" placeholder="new-channel"><button id="createChannelButton">+ Add channel</button></div>
        <div class="online-users"><h3>ONLINE</h3><div id="onlineUsers"></div></div>
        <div class="social-tools">
            <h3>FRIENDS</h3>
            <form id="friendForm">
                <input id="friendUsernameInput" placeholder="username" autocomplete="off" maxlength="24">
                <button type="submit">+ Add friend</button>
            </form>
            <div class="friend-list" id="friendList"></div>
            <h3 style="margin-top:14px;">PRIVATE GROUP</h3>
            <form id="groupForm">
                <input id="groupNameInput" placeholder="group name" autocomplete="off" maxlength="30">
                <input id="groupMembersInput" placeholder="friends, comma separated" autocomplete="off">
                <button type="submit">Create private group</button>
            </form>
            <div class="group-list" id="groupList"></div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h2 id="channelTitle"># general-chat</h2>
            <div class="chat-actions">
                <button onclick="startCall(false)">📞 Call</button>
                <button onclick="startCall(true)">📹 Video</button>
            </div>
        </div>

        <div class="messages" id="messageContainer" aria-live="polite">
            <div class="message received">
                Hey! Welcome to the new public app.
                <span class="timestamp">10:00 AM</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="call-panel" id="callPanel"><div id="callStatus">Connecting...</div><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video><button onclick="endCall()">End call</button></div>

    <script>
        const messageContainer = document.getElementById('messageContainer');
        const inputField = document.getElementById('messageInput');
        const channelTitle = document.getElementById('channelTitle');
        const authScreen = document.getElementById('authScreen');
        const authForm = document.getElementById('authForm');
        const authError = document.getElementById('authError');
        const authSwitch = document.getElementById('authSwitch');
        const onlineUsers = document.getElementById('onlineUsers');
        const friendList = document.getElementById('friendList');
        const groupList = document.getElementById('groupList');
        const callPanel = document.getElementById('callPanel');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const activeChannel = { name: 'general-chat' };
        let socket; let authMode = 'login'; let currentUser; let users = []; let friends = []; let peer; let localStream; let callTarget; let pendingCandidates = []; let endingCall = false; let pendingAuth = null; let channelData = [];

        function saveSession(account) {
            if (!account) return localStorage.removeItem('imsg-session');
            localStorage.setItem('imsg-session', JSON.stringify(account));
        }

        function restoreSession() {
            const stored = localStorage.getItem('imsg-session');
            if (!stored) return null;
            try {
                const parsed = JSON.parse(stored);
                if (parsed && parsed.username && parsed.password) return parsed;
            } catch (_) {}
            return null;
        }

        function send(message) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message)); }
        function formatTime(timestamp) { return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        function renderMessage(message) {
            const element = document.createElement('div'); element.className = `message ${message.userId === socket?.clientId ? 'sent' : 'received'}`; element.textContent = message.text;
            const timestamp = document.createElement('span'); timestamp.className = 'timestamp'; timestamp.textContent = `${message.name} · ${formatTime(message.timestamp)}`; element.appendChild(timestamp); messageContainer.appendChild(element);
        }
        function showMessages(messages) { messageContainer.replaceChildren(); messages.forEach(renderMessage); messageContainer.scrollTop = messageContainer.scrollHeight; }
        function renderFriends() {
            friendList.replaceChildren();
            if (!friends.length) { friendList.textContent = 'No friends yet'; return; }
            friends.forEach(friend => {
                const chip = document.createElement('span');
                chip.className = 'friend-chip';
                const dot = document.createElement('span');
                dot.className = `status-dot ${friend.online ? '' : 'offline'}`;
                const label = document.createElement('span');
                label.textContent = friend.username || friend;
                chip.append(dot, label);
                friendList.appendChild(chip);
            });
        }
        function renderGroups(list = channelData) {
            groupList.replaceChildren();
            const groups = (list || []).filter(channel => channel.private);
            if (!groups.length) {
                const empty = document.createElement('div');
                empty.className = 'group-item';
                empty.textContent = 'No private groups yet';
                groupList.appendChild(empty);
                return;
            }
            groups.forEach(group => {
                const item = document.createElement('div');
                item.className = `group-item ${group.id === activeChannel.name ? 'active' : ''}`;
                item.textContent = `👥 ${group.name}`;
                item.onclick = () => switchChannel(group.id);
                groupList.appendChild(item);
            });
        }
        function normalizeFriendList(list) {
            if (!Array.isArray(list)) return [];
            return list.map(friend => typeof friend === 'string' ? { username: friend, online: false } : friend);
        }
        function renderUsers() {
            onlineUsers.replaceChildren();
            const visibleUsers = users.filter(user => user.id !== socket?.clientId);
            visibleUsers.forEach(user => {
                const row = document.createElement('div'); row.className = 'online-user';
                const label = document.createElement('span');
                label.textContent = user.name;
                const actions = document.createElement('div');
                const addBtn = document.createElement('button');
                const isFriend = Array.isArray(friends) && friends.some(friend => (friend.username || friend).toLowerCase() === user.name.toLowerCase() || (typeof friend === 'object' && friend.id && friend.id.toLowerCase() === user.name.toLowerCase()));
                addBtn.textContent = isFriend ? 'Friend' : '+ Friend';
                addBtn.disabled = isFriend;
                addBtn.onclick = () => send({ type: 'addFriend', username: user.name });
                const callBtn = document.createElement('button'); callBtn.textContent = 'Call'; callBtn.onclick = () => startCall(false, user);
                const videoBtn = document.createElement('button'); videoBtn.textContent = 'Video'; videoBtn.onclick = () => startCall(true, user);
                actions.append(addBtn, callBtn, videoBtn); row.append(label, actions); onlineUsers.appendChild(row);
            });
        }
        function renderChannels(list) {
            const channelList = document.querySelector('.channel-list'); channelList.replaceChildren(); list.forEach(channel => { const item = document.createElement('li'); item.className = `channel ${channel.id === activeChannel.name ? 'active' : ''}`; item.dataset.channel = channel.id; item.textContent = `${channel.private ? '🔒' : '#'} ${channel.name}`; item.onclick = () => switchChannel(channel.id); channelList.appendChild(item); });
        }
        function switchChannel(channel) { if (channel === activeChannel.name) return; send({ type: 'switchChannel', channel }); }
        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; socket = new WebSocket(`${protocol}//${location.host}`);
            socket.onopen = () => {
                if (pendingAuth) {
                    const { username, password, mode } = pendingAuth;
                    send({ type: 'auth', mode: mode || authMode, username, password });
                    pendingAuth = null;
                }
            };
            socket.onmessage = event => { let message; try { message = JSON.parse(event.data); } catch (_) { return; }
                if (message.type === 'authenticated') {
                    socket.clientId = message.id; currentUser = message.user;
                    friends = normalizeFriendList(message.friends || []);
                    channelData = message.channels || [];
                    saveSession({ username: message.user.username, password: document.getElementById('usernameInput')?.value || '' });
                    authScreen.style.display = 'none';
                    renderChannels(message.channels); renderGroups(message.channels); users = message.users || []; showMessages(message.messages || []); renderFriends(); renderUsers();
                }
                if (message.type === 'authError') authError.textContent = message.message;
                if (message.type === 'channelJoined') { activeChannel.name = message.channel; channelTitle.textContent = `# ${message.channel}`; showMessages(message.messages || []); users = message.users || []; renderUsers(); }
                if (message.type === 'channelsUpdated') { channelData = message.channels || []; renderChannels(message.channels); renderGroups(message.channels); }
                if (message.type === 'friendsUpdated') { friends = normalizeFriendList(message.friends || []); renderFriends(); renderUsers(); }
                if (message.type === 'error') alert(message.message);
                if (message.type === 'message') { renderMessage(message.message); messageContainer.scrollTop = messageContainer.scrollHeight; }
                if (message.type === 'userJoined' || message.type === 'userUpdated') { users = users.filter(user => user.id !== message.user.id).concat(message.user); renderUsers(); }
                if (message.type === 'userLeft') { users = users.filter(user => user.id !== message.id); renderUsers(); }
                handleCallMessage(message);
            };
            socket.onclose = () => { if (currentUser) setTimeout(connect, 1500); };
        }
        authForm.onsubmit = event => {
            event.preventDefault();
            authError.textContent = '';
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            pendingAuth = { username, password, mode: authMode };
            saveSession({ username, password });
            if (socket?.readyState === WebSocket.OPEN) {
                send({ type: 'auth', mode: authMode, username, password });
                pendingAuth = null;
            }
        };
        authSwitch.onclick = () => { authMode = authMode === 'login' ? 'create' : 'login'; document.getElementById('authSubmit').textContent = authMode === 'login' ? 'Log in' : 'Create account'; authSwitch.textContent = authMode === 'login' ? 'Create a new account' : 'Back to log in'; document.getElementById('passwordInput').autocomplete = authMode === 'login' ? 'current-password' : 'new-password'; };
        document.getElementById('createChannelButton').onclick = () => { const input = document.getElementById('newChannelInput'); if (input.value.trim()) { send({ type: 'createChannel', name: input.value }); input.value = ''; } };
        document.getElementById('friendForm').onsubmit = event => { event.preventDefault(); const input = document.getElementById('friendUsernameInput'); if (input.value.trim()) { send({ type: 'addFriend', username: input.value.trim() }); input.value = ''; } };
        document.getElementById('groupForm').onsubmit = event => { event.preventDefault(); const name = document.getElementById('groupNameInput'); const members = document.getElementById('groupMembersInput'); const memberNames = members.value.split(',').map(value => value.trim()).filter(Boolean); if (name.value.trim() && memberNames.length) { send({ type: 'createPrivateGroup', name: name.value.trim(), members: memberNames }); name.value = ''; members.value = ''; } };
        function sendMessage() { const text = inputField.value.trim(); if (text) { send({ type: 'sendMessage', text }); inputField.value = ''; } }
        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        function makePeer(targetId) {
            peer = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peer.onicecandidate = event => event.candidate && send({ type: 'iceCandidate', targetId, candidate: event.candidate });
            peer.ontrack = event => { remoteVideo.srcObject = event.streams[0]; document.getElementById('callStatus').textContent = 'Connected'; };
            peer.onconnectionstatechange = () => { if (['failed', 'disconnected'].includes(peer.connectionState)) document.getElementById('callStatus').textContent = 'Connection interrupted'; };
            return peer;
        }

        async function startCall(video, user) {
            callTarget = user || users.find(item => item.id !== socket?.clientId); if (!callTarget) return alert('No other users are online.');
            try { endingCall = false; pendingCandidates = []; document.getElementById('callStatus').textContent = `Calling ${callTarget.name}...`; localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video }); localVideo.srcObject = video ? localStream : null; callPanel.style.display = 'block'; makePeer(callTarget.id); localStream.getTracks().forEach(track => peer.addTrack(track, localStream)); const offer = await peer.createOffer(); await peer.setLocalDescription(offer); send({ type: 'callOffer', targetId: callTarget.id, offer, video }); } catch (_) { alert('Camera or microphone permission is required.'); endCall(true); }
        }
        async function handleCallMessage(message) {
            if (message.type === 'callOffer') { if (!confirm(`${message.fromName} is calling. Accept?`)) return send({ type: 'callEnd', targetId: message.fromId }); try { endingCall = false; pendingCandidates = []; callTarget = { id: message.fromId, name: message.fromName }; document.getElementById('callStatus').textContent = `Connected to ${callTarget.name}`; localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: message.video }); localVideo.srcObject = message.video ? localStream : null; callPanel.style.display = 'block'; makePeer(callTarget.id); localStream.getTracks().forEach(track => peer.addTrack(track, localStream)); await peer.setRemoteDescription(message.offer); for (const candidate of pendingCandidates) await peer.addIceCandidate(candidate); pendingCandidates = []; const answer = await peer.createAnswer(); await peer.setLocalDescription(answer); send({ type: 'callAnswer', targetId: callTarget.id, answer }); } catch (_) { alert('Camera or microphone permission is required.'); endCall(true); } }
            if (message.type === 'callAnswer' && peer) { await peer.setRemoteDescription(message.answer); for (const candidate of pendingCandidates) await peer.addIceCandidate(candidate); pendingCandidates = []; document.getElementById('callStatus').textContent = 'Connected'; }
            if (message.type === 'iceCandidate' && peer) { if (peer.remoteDescription) { try { await peer.addIceCandidate(message.candidate); } catch (_) {} } else pendingCandidates.push(message.candidate); }
            if (message.type === 'callEnd') endCall(true);
        }
        function endCall(remote = false) { if (!remote && callTarget && !endingCall) { endingCall = true; send({ type: 'callEnd', targetId: callTarget.id }); } peer?.close(); localStream?.getTracks().forEach(track => track.stop()); peer = null; localStream = null; callTarget = null; pendingCandidates = []; localVideo.srcObject = null; remoteVideo.srcObject = null; callPanel.style.display = 'none'; }

        const saved = restoreSession();
        if (saved) {
            document.getElementById('usernameInput').value = saved.username || '';
            document.getElementById('passwordInput').value = saved.password || '';
            pendingAuth = { username: saved.username, password: saved.password, mode: 'login' };
        }

        connect();
    </script>

</body>
</html>
