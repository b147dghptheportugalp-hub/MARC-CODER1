<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escord - Web Chat UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #1e1f22; /* Discord Dark */
            color: #dbdee1;
        }

        /* Sidebar (Discord Style) */
        .sidebar {
            width: 250px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e1f22;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 2px solid #1e1f22;
            color: #25d366; /* WhatsApp Green Accent */
        }

        .channel-list {
            list-style: none;
            padding: 10px;
            overflow-y: auto;
        }

        .channel {
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .channel:hover, .channel.active {
            background-color: #404249;
            color: white;
        }

        /* Main Chat Area (WhatsApp Style) */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: #2b2d31;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e1f22;
        }

        .chat-actions button {
            background: none;
            border: none;
            color: #25d366; /* WhatsApp Green */
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: 15px;
            font-weight: bold;
        }

        .chat-actions button:hover {
            color: #128c7e;
        }

        /* Message Display */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Subtle texture */
        }

        .message {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .message.received {
            background-color: #2b2d31;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .message.sent {
            background-color: #005c4b; /* WhatsApp Dark Mode Sent */
            color: white;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .timestamp {
            font-size: 0.75rem;
            color: #949ba4;
            display: block;
            text-align: right;
            margin-top: 5px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background-color: #2b2d31;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background-color: #383a40;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #1da851;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            DisApp Public
        </div>
        <ul class="channel-list">
            <li class="channel active" data-channel="general-chat"># general-chat</li>
            <li class="channel" data-channel="coding-help"># coding-help</li>
            <li class="channel" data-channel="voice-calls"># voice-calls</li>
        </ul>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h2 id="channelTitle"># general-chat</h2>
            <div class="chat-actions">
                <button onclick="alert('Calling feature requires WebRTC backend!')">📞 Call</button>
                <button onclick="alert('Video feature requires WebRTC backend!')">📹 Video</button>
            </div>
        </div>

        <div class="messages" id="messageContainer" aria-live="polite">
            <div class="message received">
                Hey! Welcome to the new public app.
                <span class="timestamp">10:00 AM</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messageContainer = document.getElementById('messageContainer');
        const inputField = document.getElementById('messageInput');
        const channelTitle = document.getElementById('channelTitle');
        const activeChannel = { name: 'general-chat' };
        const username = `Guest ${Math.floor(Math.random() * 900 + 100)}`;
        let socket;

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderMessage(message) {
            const element = document.createElement('div');
            element.className = `message ${message.userId === socket?.clientId ? 'sent' : 'received'}`;
            element.textContent = message.text;
            const timestamp = document.createElement('span');
            timestamp.className = 'timestamp';
            timestamp.textContent = `${message.name} · ${formatTime(message.timestamp)}`;
            element.appendChild(timestamp);
            messageContainer.appendChild(element);
        }

        function showMessages(messages) {
            messageContainer.replaceChildren();
            messages.forEach(renderMessage);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${location.host}`);
            socket.addEventListener('open', () => socket.send(JSON.stringify({ type: 'join', name: username, channel: activeChannel.name })));
            socket.addEventListener('message', event => {
                let message;
                try { message = JSON.parse(event.data); } catch (_) { return; }
                if (message.type === 'welcome') {
                    socket.clientId = message.id;
                    showMessages(message.messages || []);
                }
                if (message.type === 'channelJoined') {
                    activeChannel.name = message.channel;
                    channelTitle.textContent = `# ${activeChannel.name}`;
                    showMessages(message.messages || []);
                }
                if (message.type === 'message') {
                    renderMessage(message.message);
                    messageContainer.scrollTop = messageContainer.scrollHeight;
                }
            });
            socket.addEventListener('close', () => setTimeout(connect, 1500));
        }

        function sendMessage() {
            const messageText = inputField.value.trim();
            if (!messageText || !socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({ type: 'sendMessage', text: messageText }));
            inputField.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        document.querySelectorAll('.channel').forEach(channel => channel.addEventListener('click', () => {
            if (!socket || socket.readyState !== WebSocket.OPEN || channel.dataset.channel === activeChannel.name) return;
            document.querySelector('.channel.active')?.classList.remove('active');
            channel.classList.add('active');
            socket.send(JSON.stringify({ type: 'switchChannel', channel: channel.dataset.channel }));
        }));

        connect();
    </script>

</body>
</html>
