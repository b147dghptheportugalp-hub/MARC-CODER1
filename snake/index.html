<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Swipe Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: #1a1c23;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .game-container {
            background-color: #282c37;
            border: 4px solid #4a5265;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pixel-top-bar {
            background-color: #363c4e;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #4a5265;
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #f39c12;
            text-shadow: 2px 2px 0 #000;
        }

        .high-score-container {
            font-size: 9px;
            color: #a0aec0;
            text-shadow: 1px 1px 0 #000;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #2d4227;
            margin: 12px;
            border: 4px inset #1c2b18;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        .swipe-hint {
            text-align: center;
            font-size: 8px;
            color: #8892b0;
            padding: 0 10px 15px 10px;
            line-height: 1.5;
            text-shadow: 1px 1px 0 #000;
        }

        /* Game Over Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(26, 28, 35, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            display: none;
        }

        .overlay.active {
            display: flex;
        }

        .overlay h2 {
            color: #e74c3c;
            font-size: 16px;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 10px;
            color: #cbd5e1;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
            line-height: 1.6;
        }

        .pixel-btn {
            background-color: #27ae60;
            color: white;
            border: 3px solid #2ecc71;
            border-bottom: 5px solid #145a32;
            padding: 10px 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 0 #111;
        }

        .pixel-btn:active {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="pixel-top-bar">
            <div class="score-container">
                <span>🍎</span>
                <span id="score">0</span>
            </div>
            <div class="high-score-container">
                HI: <span id="highScore">0</span>
            </div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="gameOverOverlay" class="overlay">
                <h2>GAME OVER</h2>
                <p>SCORE: <span id="finalScore">0</span></p>
                <button class="pixel-btn" id="restartBtn">RETRY</button>
            </div>
        </div>

        <div class="swipe-hint">
            SWIPE ANYWHERE ON SCREEN<br>OR USE ARROW KEYS / WASD
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const finalScoreElement = document.getElementById("finalScore");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const restartBtn = document.getElementById("restartBtn");

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize; 

        let snake = [
            { x: 10, y: 10 }, 
            { x: 9, y: 10 },  
            { x: 8, y: 10 },   
            { x: 7, y: 10 }   
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;  
        let dy = 0;  
        let score = 0;
        let highScore = localStorage.getItem('pixelSwipeHighScore') || 0;
        highScoreElement.textContent = highScore;

        let gameInterval;
        let gameRunning = false;

        // Sound generator using Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                if (type === 'eat') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        function startGame() {
            generateFood();
            gameRunning = true;
            gameOverOverlay.classList.remove('active');
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 110); 
        }

        function updateGame() {
            if (!gameRunning) return;
            moveSnake();

            if (checkGameOver()) {
                gameRunning = false;
                clearInterval(gameInterval);
                playSound('die');
                finalScoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('pixelSwipeHighScore', highScore);
                    highScoreElement.textContent = highScore;
                }
                gameOverOverlay.classList.add('active');
                return;
            }

            checkFoodCollision();
            drawLawn(); 
            drawFood();
            drawSnake();
        }

        function drawLawn() {
            for (let r = 0; r < tileCount; r++) {
                for (let c = 0; c < tileCount; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#344e2b" : "#2d4227";
                    ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
                }
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const px = part.x * gridSize;
                const py = part.y * gridSize;

                if (index === 0) {
                    // Head
                    ctx.fillStyle = "#5cdb5c";
                    ctx.fillRect(px + 2, py + 2, gridSize - 4, gridSize - 4);
                    
                    // Pixel eyes
                    ctx.fillStyle = "#000000";
                    let e1x = px + 4, e1y = py + 4;
                    let e2x = px + 12, e2y = py + 4;

                    if (dx === 1) { e1x = px + 12; e1y = py + 4; e2x = px + 12; e2y = py + 12; }
                    else if (dx === -1) { e1x = px + 4; e1y = py + 4; e2x = px + 4; e2y = py + 12; }
                    else if (dy === -1) { e1x = px + 4; e1y = py + 4; e2x = px + 12; e2y = py + 4; }
                    else if (dy === 1) { e1x = px + 4; e1y = py + 12; e2x = px + 12; e2y = py + 12; }

                    ctx.fillRect(e1x, e1y, 4, 4);
                    ctx.fillRect(e2x, e2y, 4, 4);
                } else {
                    // Body
                    ctx.fillStyle = index % 2 === 0 ? "#43a047" : "#388e3c";
                    ctx.fillRect(px + 3, py + 3, gridSize - 6, gridSize - 6);
                }
            });
        }

        function drawFood() {
            const fx = food.x * gridSize;
            const fy = food.y * gridSize;

            ctx.fillStyle = "#e53935";
            ctx.fillRect(fx + 3, fy + 5, gridSize - 6, gridSize - 6);
            
            ctx.fillStyle = "#ff8a80";
            ctx.fillRect(fx + 5, fy + 7, 3, 3);

            ctx.fillStyle = "#5d4037";
            ctx.fillRect(fx + 9, fy + 2, 2, 3);
            ctx.fillStyle = "#4caf50";
            ctx.fillRect(fx + 11, fy + 2, 4, 2);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); 
            snake.pop(); 
        }

        // --- DIRECT FINGER SWIPE CONTROLS & KEYBOARD ---
        let touchStartX = 0;
        let touchStartY = 0;
        const swipeThreshold = 15;

        window.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
            e.preventDefault(); // Prevent page scrolling/zooming while swiping
        }, { passive: false });

        window.addEventListener("touchend", (e) => {
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            const goingUp = (dy === -1);
            const goingDown = (dy === 1);
            const goingRight = (dx === 1);
            const goingLeft = (dx === -1);

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > swipeThreshold) {
                    if (diffX > 0 && !goingLeft) { dx = 1; dy = 0; }
                    else if (diffX < 0 && !goingRight) { dx = -1; dy = 0; }
                }
            } else {
                if (Math.abs(diffY) > swipeThreshold) {
                    if (diffY > 0 && !goingUp) { dx = 0; dy = 1; }
                    else if (diffY < 0 && !goingDown) { dx = 0; dy = -1; }
                }
            }
        });

        document.addEventListener("keydown", (event) => {
            const keyPressed = event.key;
            if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(keyPressed)) {
                event.preventDefault();
            }

            const goingUp = (dy === -1);
            const goingDown = (dy === 1);
            const goingRight = (dx === 1);
            const goingLeft = (dx === -1);

            if ((keyPressed === "ArrowLeft" || keyPressed === "a") && !goingRight) { dx = -1; dy = 0; }
            if ((keyPressed === "ArrowRight" || keyPressed === "d") && !goingLeft) { dx = 1; dy = 0; }
            if ((keyPressed === "ArrowUp" || keyPressed === "w") && !goingDown) { dx = 0; dy = -1; }
            if ((keyPressed === "ArrowDown" || keyPressed === "s") && !goingUp) { dx = 0; dy = 1; }
        });

        restartBtn.addEventListener("click", resetGame);

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function checkFoodCollision() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 1; 
                scoreElement.textContent = score;
                playSound('eat');
                const tail = { ...snake[snake.length - 1] };
                snake.push(tail);
                generateFood();
            }
        }

        function checkGameOver() {
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 },
                { x: 7, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            startGame();
        }

        startGame();
    </script>
</body>
</html>
