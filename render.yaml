services:
  - type: web
    name: poxel-io
    runtime: node
    plan: free
    buildCommand: npm install --prefix poxel-io
    startCommand: npm start --prefix poxel-io
    healthCheckPath: /health
  - type: web
    name: palmon-io
    runtime: node
    plan: free
    rootDir: palmon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
  - type: web
    name: spaceshooter-io
    runtime: node
    plan: free
    rootDir: spaceshooter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
  - type: web
    name: race-io
    runtime: node
    plan: free
    rootDir: racinggame
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
  - type: web
    name: imsg-io
    runtime: node
    plan: free
    rootDir: imsg
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health