<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker - Ultra Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0c0a;
            --bg-container: #1a1512;
            --bg-card: #261f1a;
            --bg-card-hover: #362c25;
            --accent-gold: #f5b041;
            --accent-gold-glow: rgba(245, 176, 65, 0.4);
            --accent-blue: #5dade2;
            --text-main: #fdfefe;
            --text-muted: #a6acaf;
            --border-color: #3e332a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at center, #2a1f18 0%, var(--bg-primary) 100%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevent scrollbars from particles */
            user-select: none;
        }

        /* Top Header Navigation */
        .top-bar {
            width: 100%;
            height: 65px;
            background: rgba(26, 21, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(90deg, #f5b041, #f39c12);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .top-stats { display: flex; gap: 30px; font-size: 0.95rem; color: var(--text-muted); }
        .top-stats span { color: var(--text-main); font-weight: 700; }

        .btn-action {
            background: linear-gradient(145deg, var(--bg-card), var(--bg-container));
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-action:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--accent-gold-glow);
        }

        /* Main Game Layout */
        .game-layout {
            display: flex;
            width: 100%;
            height: calc(100vh - 65px);
            max-width: 1400px;
            padding: 30px;
            gap: 30px;
            justify-content: center;
        }

        /* Clicker Zone */
        .clicker-section {
            background: rgba(26, 21, 18, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        .cookie-counter-box { text-align: center; margin-bottom: 50px; z-index: 10;}
        #cookie-count {
            font-size: 4rem; font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: -1px; margin-bottom: 5px;
        }
        #cps-display {
            font-size: 1.3rem; color: var(--accent-gold);
            font-weight: 700; background: rgba(245, 176, 65, 0.1);
            padding: 6px 16px; border-radius: 20px; display: inline-block;
        }

        /* Interactive Cookie */
        .cookie-wrapper {
            position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        
        /* Spinning Light Aura */
        .cookie-aura {
            position: absolute;
            width: 350px; height: 350px;
            background: conic-gradient(from 0deg, transparent 0deg, var(--accent-gold-glow) 45deg, transparent 90deg, var(--accent-gold-glow) 135deg, transparent 180deg, var(--accent-gold-glow) 225deg, transparent 270deg, var(--accent-gold-glow) 315deg, transparent 360deg);
            border-radius: 50%;
            animation: spin 15s linear infinite;
            z-index: 1;
            pointer-events: none;
            filter: blur(10px);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        #cookie {
            font-size: 180px; z-index: 2;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
            user-select: none;
        }
        #cookie:active { transform: scale(0.92); filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); }

        .click-power-indicator {
            margin-top: 50px; font-size: 1rem; color: var(--text-muted);
            background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 12px;
            border: 1px solid var(--border-color); z-index: 10;
        }

        /* Shop Section */
        .shop-section {
            background: var(--bg-container); border: 1px solid var(--border-color);
            border-radius: 24px; width: 450px; display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden;
        }

        .shop-header {
            padding: 24px; border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }
        .shop-header h2 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }

        .shop-body {
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; flex: 1;
        }
        .shop-body::-webkit-scrollbar { width: 8px; }
        .shop-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .shop-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .shop-category-title {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--accent-blue); margin: 15px 0 5px 5px; font-weight: 700;
        }

        /* Upgrade Cards */
        .upgrade-btn {
            background: linear-gradient(145deg, var(--bg-card), #201a15);
            border: 1px solid var(--border-color); border-radius: 14px;
            padding: 16px; color: var(--text-main); text-align: left; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.2s ease; position: relative;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: var(--bg-card-hover); border-color: var(--accent-gold);
            transform: scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 5;
        }

        .upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(80%); }

        .upgrade-info { display: flex; flex-direction: column; gap: 4px; width: 65%; }
        .upgrade-title { font-weight: 700; font-size: 1.05rem; }
        .upgrade-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; }
        
        .upgrade-cost-area { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .upgrade-cost { font-weight: 800; font-size: 1rem; color: var(--accent-gold); }
        .upgrade-owned { font-size: 0.8rem; font-weight: 600; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 12px; }

        /* Floating VFX Numbers */
        .floating-number {
            position: absolute; font-weight: 800; font-size: 1.5rem;
            color: #fff; pointer-events: none; z-index: 100;
            text-shadow: 0 3px 8px rgba(0,0,0,0.8);
            animation: floatUp 0.9s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        .crit-number { color: #e74c3c; font-size: 2rem; text-shadow: 0 0 15px rgba(231, 76, 60, 0.8); }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.3); }
        }

        /* Particle Physics Mini-Cookies */
        .particle {
            position: absolute; pointer-events: none; z-index: 40; font-size: 20px;
        }

        /* Golden Cookie */
        #golden-cookie {
            display: none; position: absolute; font-size: 70px; cursor: pointer; z-index: 2000;
            animation: pulseGolden 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 30px #f5b041);
        }
        @keyframes pulseGolden { 0% { transform: scale(1) rotate(-5deg); } 100% { transform: scale(1.15) rotate(5deg); } }

        /* Toast */
        #notification {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(150px);
            background: rgba(38, 31, 26, 0.95); backdrop-filter: blur(10px);
            border: 1px solid var(--accent-gold); color: #fff; padding: 16px 30px;
            border-radius: 50px; font-weight: 700; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; z-index: 3000; font-size: 1.1rem;
        }
        #notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="golden-cookie">🌟</div>
    <div id="notification">✨ <span id="notif-text">Saved!</span></div>

    <header class="top-bar">
        <div class="game-title">🍪 Cookie Clicker Deluxe</div>
        <div class="top-stats">
            <div>Clicks: <span id="stat-clicks">0</span></div>
            <div>Playtime: <span id="stat-time">0s</span></div>
        </div>
        <button class="btn-action" id="save-btn">💾 Force Save Game</button>
    </header>

    <div class="game-layout">
        <div class="clicker-section">
            <div class="cookie-counter-box">
                <div id="cookie-count">0</div>
                <div id="cps-display">0.0 CPS</div>
            </div>

            <div class="cookie-wrapper" id="cookie-container">
                <div class="cookie-aura"></div>
                <div id="cookie">🍪</div>
            </div>

            <div class="click-power-indicator">
                Manual Click: <span id="click-power-val" style="color: var(--accent-gold); font-weight: 800;">1</span> 🍪
            </div>
        </div>

        <div class="shop-section">
            <div class="shop-header">
                <h2>🛒 Upgrades & Automation</h2>
            </div>
            <div class="shop-body" id="shop-container">
                </div>
        </div>
    </div>

    <script>
        // --- DATA STRUCTURES ---
        const activeUpgrades = [
            { id: "click", name: "👍 Reinforced Thumbs", desc: "+1 Base Click Power", baseCost: 50, costMult: 1.5 },
            { id: "golden", name: "🍀 Lucky Charm", desc: "Golden cookies spawn faster", baseCost: 777, costMult: 3 },
            { id: "crit", name: "🎯 Critical Strike", desc: "5% chance for 10x click value", baseCost: 5000, costMult: 4 },
            { id: "synergy", name: "🔗 Synergy Core", desc: "Click gains 1% of total CPS", baseCost: 50000, costMult: 5 }
        ];

        const buildingsList = [
            { id: "pointer", name: "🖐️ Pointer", desc: "Auto-clicks for you.", baseCost: 15, baseCps: 0.5 },
            { id: "grandma", name: "👵 Grandma", desc: "Bakes cookies with love.", baseCost: 100, baseCps: 4 },
            { id: "farm", name: "🧑‍🌾 Farm", desc: "Grows cookie plants.", baseCost: 1100, baseCps: 16 },
            { id: "factory", name: "🏭 Factory", desc: "Mass produces cookies.", baseCost: 12000, baseCps: 65 },
            { id: "mine", name: "⛏️ Mine", desc: "Mines chocolate chips.", baseCost: 130000, baseCps: 260 },
            { id: "bank", name: "🏦 Bank", desc: "Generates interest.", baseCost: 1400000, baseCps: 1400 },
            { id: "temple", name: "🏛️ Temple", desc: "Pray to baking gods.", baseCost: 20000000, baseCps: 7800 },
            { id: "wizard", name: "🧙 Wizard Tower", desc: "Summons magic cookies.", baseCost: 330000000, baseCps: 44000 },
            { id: "rocket", name: "🚀 Rocket Ship", desc: "Space cookies.", baseCost: 5100000000, baseCps: 260000 },
            { id: "alchemy", name: "⚗️ Alchemy Lab", desc: "Turns gold to cookies.", baseCost: 75000000000, baseCps: 1600000 },
            { id: "portal", name: "🌀 Portal", desc: "Opens a door to the cookieverse.", baseCost: 1000000000000, baseCps: 10000000 },
            { id: "timeMachine", name: "⏳ Time Machine", desc: "Brings cookies from the past.", baseCost: 14000000000000, baseCps: 65000000 }
        ];

        // --- GAME STATE ---
        let game = {
            cookies: 0,
            totalClicks: 0,
            timePlayed: 0,
            upgrades: { click: 0, golden: 0, crit: 0, synergy: 0 },
            buildings: {} // Populated dynamically
        };
        
        buildingsList.forEach(b => game.buildings[b.id] = 0);

        let currentCps = 0;
        let currentClickValue = 1;
        let goldenActive = false;

        // --- UTILS ---
        // Formats large numbers into K, M, B, T, Qa, etc.
        function formatNumber(num) {
            if (num < 1000) return Math.floor(num).toString();
            const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx"];
            const suffixNum = Math.floor(("" + Math.floor(num)).length / 3);
            let shortValue = parseFloat((suffixNum !== 0 ? (num / Math.pow(1000, suffixNum)) : num).toPrecision(3));
            if (shortValue % 1 !== 0) shortValue = shortValue.toFixed(1);
            return shortValue + suffixes[suffixNum];
        }

        function getCost(baseCost, mult, count) {
            return Math.floor(baseCost * Math.pow(mult, count));
        }

        // --- UI GENERATION ---
        const shopContainer = document.getElementById("shop-container");

        function initShop() {
            shopContainer.innerHTML = `<div class="shop-category-title">Active Upgrades</div>`;
            activeUpgrades.forEach(u => {
                shopContainer.innerHTML += `
                    <button class="upgrade-btn" id="upg-${u.id}" onclick="buyUpgrade('${u.id}')">
                        <div class="upgrade-info">
                            <span class="upgrade-title">${u.name}</span>
                            <span class="upgrade-desc">${u.desc}</span>
                        </div>
                        <div class="upgrade-cost-area">
                            <span class="upgrade-cost" id="upg-cost-${u.id}">0</span>
                            <span class="upgrade-owned" id="upg-lvl-${u.id}">Lvl 0</span>
                        </div>
                    </button>
                `;
            });

            shopContainer.innerHTML += `<div class="shop-category-title" style="margin-top:20px;">Buildings</div>`;
            buildingsList.forEach(b => {
                shopContainer.innerHTML += `
                    <button class="upgrade-btn" id="bld-${b.id}" onclick="buyBuilding('${b.id}')">
                        <div class="upgrade-info">
                            <span class="upgrade-title">${b.name}</span>
                            <span class="upgrade-desc">${b.desc} (+${formatNumber(b.baseCps)} CPS)</span>
                        </div>
                        <div class="upgrade-cost-area">
                            <span class="upgrade-cost" id="bld-cost-${b.id}">0</span>
                            <span class="upgrade-owned" id="bld-count-${b.id}">0</span>
                        </div>
                    </button>
                `;
            });
        }

        // --- GAME LOGIC ---
        function calculateStats() {
            // Calculate CPS
            let cps = 0;
            buildingsList.forEach(b => {
                cps += game.buildings[b.id] * b.baseCps;
            });
            currentCps = cps;

            // Calculate Click Value
            let clickBase = 1 + game.upgrades.click;
            let synergyBonus = game.upgrades.synergy > 0 ? (currentCps * 0.01 * game.upgrades.synergy) : 0;
            currentClickValue = clickBase + synergyBonus;
        }

        function updateUI() {
            calculateStats();
            document.getElementById("cookie-count").innerText = formatNumber(game.cookies) + " cookies";
            document.getElementById("cps-display").innerText = formatNumber(currentCps) + " CPS";
            document.getElementById("click-power-val").innerText = formatNumber(currentClickValue);
            document.getElementById("stat-clicks").innerText = formatNumber(game.totalClicks);

            // Update Upgrades
            activeUpgrades.forEach(u => {
                let cost = getCost(u.baseCost, u.costMult, game.upgrades[u.id]);
                document.getElementById(`upg-cost-${u.id}`).innerText = formatNumber(cost) + " 🍪";
                document.getElementById(`upg-lvl-${u.id}`).innerText = "Lvl " + game.upgrades[u.id];
                document.getElementById(`upg-${u.id}`).disabled = game.cookies < cost;
            });

            // Update Buildings
            buildingsList.forEach(b => {
                let cost = getCost(b.baseCost, 1.15, game.buildings[b.id]);
                document.getElementById(`bld-cost-${b.id}`).innerText = formatNumber(cost) + " 🍪";
                document.getElementById(`bld-count-${b.id}`).innerText = game.buildings[b.id];
                document.getElementById(`bld-${b.id}`).disabled = game.cookies < cost;
            });
        }

        // --- BUY FUNCTIONS ---
        window.buyUpgrade = function(id) {
            let def = activeUpgrades.find(u => u.id === id);
            let cost = getCost(def.baseCost, def.costMult, game.upgrades[id]);
            if (game.cookies >= cost) {
                game.cookies -= cost;
                game.upgrades[id]++;
                updateUI();
            }
        };

        window.buyBuilding = function(id) {
            let def = buildingsList.find(b => b.id === id);
            let cost = getCost(def.baseCost, 1.15, game.buildings[id]);
            if (game.cookies >= cost) {
                game.cookies -= cost;
                game.buildings[id]++;
                updateUI();
            }
        };

        // --- INTERACTION & VFX ---
        const cookieBtn = document.getElementById("cookie");
        const clickerSection = document.querySelector(".clicker-section");

        cookieBtn.addEventListener("mousedown", (e) => {
            let val = currentClickValue;
            let isCrit = false;

            // Crit Logic
            if (game.upgrades.crit > 0) {
                let chance = 0.05 + (game.upgrades.crit * 0.01); // 5% + 1% per level
                if (Math.random() < chance) {
                    val *= 10;
                    isCrit = true;
                }
            }

            game.cookies += val;
            game.totalClicks++;
            
            spawnFloatingText(e.clientX, e.clientY, `+${formatNumber(val)}`, isCrit);
            createParticles(e.clientX, e.clientY);
            updateUI();
        });

        function spawnFloatingText(x, y, text, isCrit) {
            const el = document.createElement("div");
            el.className = `floating-number ${isCrit ? 'crit-number' : ''}`;
            el.innerText = isCrit ? `${text} CRIT!` : text;
            el.style.left = `${x + (Math.random()*40-20)}px`;
            el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        function createParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.innerText = "🍪";
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                document.body.appendChild(p);

                let angle = Math.random() * Math.PI * 2;
                let velocity = 5 + Math.random() * 10;
                let vx = Math.cos(angle) * velocity;
                let vy = Math.sin(angle) * velocity - 5; // Initial upward bounce
                let rot = Math.random() * 360;
                let rotSpeed = (Math.random() - 0.5) * 20;

                let startX = x; let startY = y;
                
                function animateParticle() {
                    vy += 0.5; // gravity
                    startX += vx; startY += vy; rot += rotSpeed;
                    p.style.left = `${startX}px`;
                    p.style.top = `${startY}px`;
                    p.style.transform = `rotate(${rot}deg) scale(${1 - (vy/50)})`;
                    
                    if (startY < window.innerHeight + 50) requestAnimationFrame(animateParticle);
                    else p.remove();
                }
                requestAnimationFrame(animateParticle);
            }
        }

        // --- GOLDEN COOKIE ---
        const goldenCookieBtn = document.getElementById("golden-cookie");
        
        goldenCookieBtn.addEventListener("click", () => {
            if (!goldenActive) return;
            let reward = Math.max(1000, currentCps * 60 * 15); // 15 mins of CPS
            game.cookies += reward;
            
            goldenCookieBtn.style.display = "none";
            goldenActive = false;
            
            showToast(`🌟 Lucky! +${formatNumber(reward)} cookies!`);
            updateUI();
        });

        function queueGoldenCookie() {
            let baseTime = Math.random() * 45000 + 45000; // 45-90 seconds
            let timeToWait = baseTime * Math.pow(0.85, game.upgrades.golden); // Reducer per level
            
            setTimeout(() => {
                if (!goldenActive) {
                    goldenActive = true;
                    goldenCookieBtn.style.left = `${50 + Math.random() * (window.innerWidth - 100)}px`;
                    goldenCookieBtn.style.top = `${80 + Math.random() * (window.innerHeight - 150)}px`;
                    goldenCookieBtn.style.display = 'block';
                    
                    setTimeout(() => {
                        goldenCookieBtn.style.display = 'none';
                        goldenActive = false;
                    }, 12000); // Disappears after 12s
                }
                queueGoldenCookie();
            }, timeToWait);
        }

        function showToast(text) {
            const notif = document.getElementById("notification");
            document.getElementById("notif-text").innerText = text;
            notif.classList.add("show");
            setTimeout(() => notif.classList.remove("show"), 3000);
        }

        // --- SAVE/LOAD ---
        function saveGame() {
            localStorage.setItem("cookieClickerUltraSave", JSON.stringify(game));
            showToast("Game Saved!");
        }

        function loadGame() {
            const saved = localStorage.getItem("cookieClickerUltraSave");
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    game = { ...game, ...parsed }; // Merge to keep new buildings if updated
                } catch (e) { console.error("Save load failed"); }
            }
        }
        document.getElementById("save-btn").addEventListener("click", saveGame);

        // --- LOOPS ---
        setInterval(() => {
            game.cookies += currentCps / 10;
            updateUI();
        }, 100);

        setInterval(() => {
            game.timePlayed++;
            let mins = Math.floor(game.timePlayed / 60);
            let secs = game.timePlayed % 60;
            document.getElementById("stat-time").innerText = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        }, 1000);

        setInterval(saveGame, 60000); // Auto-save every minute

        // --- INITIALIZATION ---
        initShop();
        loadGame();
        updateUI();
        queueGoldenCookie();

    </script>
</body>
</html>
