<!DOCTYPE html>
<html>
<head>
<title>Simple HTML Runner</title>

<style>
body{
    font-family:Arial;
    background:#222;
    color:white;
    padding:20px;
}

textarea{
    width:100%;
    height:200px;
    background:#111;
    color:#00ff00;
    font-size:16px;
    padding:10px;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

iframe{
    width:100%;
    height:300px;
    background:white;
    margin-top:20px;
}
</style>

</head>

<body>

<h1>HTML Runner</h1>

<textarea id="code">
<h1>Hello World</h1>
<p>This is my HTML code!</p>
</textarea>

<br><br>

<button onclick="run()">Run</button>

<iframe id="preview"></iframe>


<script>

function run(){
    let code = document.getElementById("code").value;
    document.getElementById("preview").srcdoc = code;
}

</script>

</body>
</html>
