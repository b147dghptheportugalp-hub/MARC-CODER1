<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Synth Pad 20</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow-x: hidden;
            background: #05050a; color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 15px 10px; touch-action: manipulation;
        }

        #back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 255, 255, 0.2); border: 1px solid #0ff; color: #0ff;
            padding: 8px 14px; border-radius: 6px; font-family: inherit; font-weight: bold;
            cursor: pointer; z-index: 10; text-decoration: none; font-size: 14px;
        }
        #back-btn:hover { background: #0ff; color: #000; }

        h1 { font-size: 20px; margin-top: 5px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.4); text-align: center; }
        .subtitle { font-size: 11px; color: #888; margin-bottom: 15px; text-align: center; }

        #app-container {
            display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px;
        }

        .controls-bar {
            display: flex; gap: 10px; margin-bottom: 15px; width: 100%; justify-content: center;
        }

        .btn {
            background: rgba(0, 255, 255, 0.15); border: 1px solid #0ff; color: #0ff;
            padding: 10px 20px; border-radius: 6px; font-family: inherit; font-weight: bold;
            cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .btn:hover { background: #0ff; color: #000; }
        .btn.recording { background: #ff3333; border-color: #ff3333; color: #fff; box-shadow: 0 0 15px rgba(255,51,51,0.8); animation: pulse 1s infinite; }
        .btn.ready-play { background: #00ff66; border-color: #00ff66; color: #000; box-shadow: 0 0 15px rgba(0,255,102,0.6); }
        .btn.playing-rec { background: #ffff00; border-color: #ffff00; color: #000; box-shadow: 0 0 15px rgba(255,255,0,0.6); }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #pad-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 600px) {
            #pad-container { grid-template-columns: repeat(5, 1fr); }
        }

        .drum-pad {
            aspect-ratio: 1;
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.05s, background 0.05s, border-color 0.05s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .drum-pad .icon-pad { font-size: 22px; margin-bottom: 3px; pointer-events: none; }
        .drum-pad .label { font-size: 10px; color: #aaa; font-weight: bold; pointer-events: none; text-align: center; }

        .drum-pad:active, .drum-pad.active {
            transform: scale(0.93);
            background: rgba(0, 255, 255, 0.25);
            border-color: #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        .drum-pad:active .label, .drum-pad.active .label { color: #fff; }
    </style>
</head>
<body>

<a href="../index.html" id="back-btn">← MENU</a>

<div id="app-container">
    <h1>CYBER SYNTH PAD</h1>
    <p class="subtitle">20 Cyber Sound Pads & Precision Live Recorder</p>

    <div class="controls-bar">
        <button class="btn" id="rec-btn" onclick="handleRecordButton()">⏺ RECORD JAM</button>
    </div>

    <div id="pad-container">
        <div class="drum-pad" onclick="triggerPad('kick')" ontouchstart="triggerPad('kick')"><span class="icon-pad">💥</span><span class="label">KICK</span></div>
        <div class="drum-pad" onclick="triggerPad('snare')" ontouchstart="triggerPad('snare')"><span class="icon-pad">⚡</span><span class="label">SNARE</span></div>
        <div class="drum-pad" onclick="triggerPad('hihat')" ontouchstart="triggerPad('hihat')"><span class="icon-pad">✨</span><span class="label">HI-HAT</span></div>
        <div class="drum-pad" onclick="triggerPad('clap')" ontouchstart="triggerPad('clap')"><span class="icon-pad">👏</span><span class="label">CLAP</span></div>
        <div class="drum-pad" onclick="triggerPad('cowbell')" ontouchstart="triggerPad('cowbell')"><span class="icon-pad">🔔</span><span class="label">COWBELL</span></div>

        <div class="drum-pad" onclick="triggerPad('laser')" ontouchstart="triggerPad('laser')"><span class="icon-pad">🚀</span><span class="label">LASER</span></div>
        <div class="drum-pad" onclick="triggerPad('bass')" ontouchstart="triggerPad('bass')"><span class="icon-pad">🔊</span><span class="label">BASS</span></div>
        <div class="drum-pad" onclick="triggerPad('zap')" ontouchstart="triggerPad('zap')"><span class="icon-pad">⚡</span><span class="label">ZAP</span></div>
        <div class="drum-pad" onclick="triggerPad('blip')" ontouchstart="triggerPad('blip')"><span class="icon-pad">🔘</span><span class="label">BLIP</span></div>
        <div class="drum-pad" onclick="triggerPad('tom')" ontouchstart="triggerPad('tom')"><span class="icon-pad">🥁</span><span class="label">TOM</span></div>

        <div class="drum-pad" onclick="triggerPad('sub')" ontouchstart="triggerPad('sub')"><span class="icon-pad">🌊</span><span class="label">SUB DROP</span></div>
        <div class="drum-pad" onclick="triggerPad('rise')" ontouchstart="triggerPad('rise')"><span class="icon-pad">📈</span><span class="label">RISER</span></div>
        <div class="drum-pad" onclick="triggerPad('fall')" ontouchstart="triggerPad('fall')"><span class="icon-pad">📉</span><span class="label">FALLER</span></div>
        <div class="drum-pad" onclick="triggerPad('hit')" ontouchstart="triggerPad('hit')"><span class="icon-pad">🔔</span><span class="label">CYBER HIT</span></div>
        <div class="drum-pad" onclick="triggerPad('glitch')" ontouchstart="triggerPad('glitch')"><span class="icon-pad">👾</span><span class="label">GLITCH</span></div>

        <div class="drum-pad" onclick="triggerPad('bit')" ontouchstart="triggerPad('bit')"><span class="icon-pad">👾</span><span class="label">8-BIT</span></div>
        <div class="drum-pad" onclick="triggerPad('scifi')" ontouchstart="triggerPad('scifi')"><span class="icon-pad">🛸</span><span class="label">SCI-FI</span></div>
        <div class="drum-pad" onclick="triggerPad('wobble')" ontouchstart="triggerPad('wobble')"><span class="icon-pad">🌀</span><span class="label">WOBBLE</span></div>
        <div class="drum-pad" onclick="triggerPad('chorda')" ontouchstart="triggerPad('chorda')"><span class="icon-pad">🎹</span><span class="label">CHORD A</span></div>
        <div class="drum-pad" onclick="triggerPad('chordb')" ontouchstart="triggerPad('chordb')"><span class="icon-pad">🎵</span><span class="label">CHORD B</span></div>
    </div>
</div>

<script>
let audioCtx = null;
let isRecording = false;
let recStartTime = 0;
let recordedEvents = [];
let playbackTimeouts = [];
let recState = 0; // 0: Ready, 1: Recording, 2: Ready to play, 3: Playing recorded

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function triggerPad(type, isPlayback = false) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // If actively recording, log this event timestamp
    if (isRecording && !isPlayback) {
        let timestamp = Date.now() - recStartTime;
        recordedEvents.push({ time: timestamp, type: type });
    }

    playSound(type);
}

function playSound(type) {
    const now = audioCtx.currentTime;

    if (type === 'kick') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.3);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    } 
    else if (type === 'snare') {
        let bufferSize = audioCtx.sampleRate * 0.2;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 800;
        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
    }
    else if (type === 'hihat') {
        let bufferSize = audioCtx.sampleRate * 0.08;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 5000;
        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
    }
    else if (type === 'clap') {
        for(let i=0; i<3; i++) {
            let t = now + (i * 0.03);
            let bufferSize = audioCtx.sampleRate * 0.05;
            let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let data = buffer.getChannelData(0);
            for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
            let noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            let filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;
            let gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(t);
        }
    }
    else if (type === 'cowbell') {
        [800, 540].forEach(f => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        });
    }
    else if (type === 'laser') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }
    else if (type === 'bass') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
    }
    else if (type === 'zap') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
    }
    else if (type === 'blip') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
    }
    else if (type === 'tom') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }
    else if (type === 'sub') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
    }
    else if (type === 'rise') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
    }
    else if (type === 'fall') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.5);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
    }
    else if (type === 'hit') {
        [440, 554.37, 659.25].forEach(f => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        });
    }
    else if (type === 'glitch') {
        let bufferSize = audioCtx.sampleRate * 0.15;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() > 0.5 ? 1 : -1) * Math.random();
        let noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        noise.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
    }
    else if (type === 'bit') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.05);
        osc.frequency.setValueAtTime(660, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }
    else if (type === 'scifi') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.15);
        osc.frequency.linearRampToValueAtTime(200, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
    }
    else if (type === 'wobble') {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, now);
        filter.frequency.linearRampToValueAtTime(1500, now + 0.2);
        filter.frequency.linearRampToValueAtTime(200, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
    }
    else if (type === 'chorda') {
        [220, 277.18, 329.63].forEach(f => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        });
    }
    else if (type === 'chordb') {
        [349.23, 440, 523.25].forEach(f => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        });
    }
}

function handleRecordButton() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const btn = document.getElementById('rec-btn');

    if (recState === 0) {
        // Press 1: Start Recording
        recordedEvents = [];
        recStartTime = Date.now();
        isRecording = true;
        recState = 1;
        btn.className = 'btn recording';
        btn.innerText = '🔴 STOP RECORDING';
    } 
    else if (recState === 1) {
        // Press 2: Stop Recording
        isRecording = false;
        recState = 2;
        btn.className = 'btn ready-play';
        btn.innerText = '▶ PLAY RECORDED';
    } 
    else if (recState === 2) {
        // Press 3: Play Recorded Jam
        if (recordedEvents.length === 0) {
            alert("No notes recorded yet! Tap some pads while recording.");
            return;
        }
        recState = 3;
        btn.className = 'btn playing-rec';
        btn.innerText = '⏹ STOP PLAYBACK';

        playbackTimeouts = recordedEvents.map(event => {
            return setTimeout(() => {
                triggerPad(event.type, true);
            }, event.time);
        });

        let maxTime = Math.max(...recordedEvents.map(e => e.time)) + 800;
        let endTimeout = setTimeout(() => {
            if (recState === 3) {
                recState = 2;
                btn.className = 'btn ready-play';
                btn.innerText = '▶ PLAY RECORDED';
            }
        }, maxTime);
        playbackTimeouts.push(endTimeout);
    } 
    else if (recState === 3) {
        // Press 4: Stop Playback & Reset
        playbackTimeouts.forEach(t => clearTimeout(t));
        playbackTimeouts = [];
        isRecording = false;
        recState = 0;
        btn.className = 'btn';
        btn.innerText = '⏺ RECORD JAM';
    }
}
</script>
</body>
</html>
