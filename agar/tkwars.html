<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>tkwars Agar</title>


<style>

html,body{

margin:0;
width:100%;
height:100%;

overflow:hidden;

background:#f2f2f2;

font-family:Arial,sans-serif;

touch-action:none;

}


#canvas{

display:block;

}



#ui{

position:absolute;

bottom:20px;

left:20px;

background:white;

padding:10px 20px;

border-radius:8px;

font-size:20px;

font-weight:bold;

z-index:10;

}



#controls-tip{

position:absolute;

bottom:20px;

left:190px;

background:white;

padding:10px;

border-radius:8px;

z-index:10;

color:#555;

}



#leaderboard{

position:absolute;

top:20px;

right:20px;

width:180px;

background:white;

padding:15px;

border-radius:10px;

z-index:10;

}


#leaderboard h3{

margin:0 0 10px;

text-align:center;

}



#minimap-container{

position:absolute;

bottom:20px;

right:20px;

width:150px;

height:150px;

background:white;

border:2px solid #999;

border-radius:10px;

overflow:hidden;

z-index:15;

}



#mobile-controls-container{

display:none;

position:absolute;

bottom:25px;

right:20px;

gap:8px;

z-index:20;

}



.mobile-btn{

width:65px;

height:65px;

border-radius:50%;

background:rgba(0,0,0,.45);

border:2px solid white;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:12px;

font-weight:bold;

}



#btn-split{

background:rgba(255,0,0,.5);

}


#btn-join{

background:rgba(0,150,255,.5);

}



#btn-shoot{

background:rgba(255,200,0,.5);

}


#btn-tank{

background:rgba(200,50,50,.5);

}


#btn-heal{

background:rgba(0,200,100,.5);

}


</style>

</head>


<body>



<div id="ui">

Score:
<span id="score">0</span>

</div>



<div id="controls-tip">

Desktop:
<b>SPACE</b> Split |
<b>J</b> Join |
<b>W</b> Feed |
<b>G</b> Tank |
<b>H</b> Heal

</div>



<div id="leaderboard">

<h3>Leaderboard</h3>

<ol id="leaderboardList"></ol>

</div>



<div id="minimap-container">

<canvas id="minimap"></canvas>

</div>



<div id="mobile-controls-container">


<div id="btn-split" class="mobile-btn">
SPLIT
</div>


<div id="btn-join" class="mobile-btn">
JOIN
</div>


<div id="btn-shoot" class="mobile-btn">
FEED
</div>


<div id="btn-tank" class="mobile-btn">
TANK
</div>


<div id="btn-heal" class="mobile-btn">
HEAL
</div>


</div>



<canvas id="canvas"></canvas>



<script>


const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");


const minimapCanvas=document.getElementById("minimap");

const mctx=minimapCanvas.getContext("2d");



function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;


minimapCanvas.width=150;

minimapCanvas.height=150;

}


window.addEventListener("resize",resize);

resize();



const MAP_SIZE=15000;

const MAX_FOOD=2000;


let food=[];

let players=[];

let projectiles=[];


let mouse={

x:0,

y:0

};







class Cell{


constructor(x,y,mass,color,parentName,isBot=true){


this.x=x;

this.y=y;


this.mass=mass;


this.radius=Math.sqrt(mass)*8;


this.color=color;


this.parentName=parentName;


this.isBot=isBot;



this.vx=0;

this.vy=0;



this.boostX=0;

this.boostY=0;

this.boostDuration=0;



// JOIN SYSTEM

this.canMerge=false;

this.mergeTimer=600;


}





update(targetX,targetY){



if(this.mergeTimer>0){

this.mergeTimer--;

}



if(this.mergeTimer<=0){

this.canMerge=true;

}




this.radius=Math.sqrt(this.mass)*8;



let speed=Math.max(

1.5,

9-(this.radius*0.02)

);



let dx=targetX-this.x;

let dy=targetY-this.y;


let dist=Math.sqrt(dx*dx+dy*dy);



if(dist>10){

this.vx=(dx/dist)*speed;

this.vy=(dy/dist)*speed;

}



else{

this.vx*=0.9;

this.vy*=0.9;

}




if(this.boostDuration>0){


this.x+=this.boostX*(this.boostDuration/20);

this.y+=this.boostY*(this.boostDuration/20);


this.boostDuration--;

}




this.x+=this.vx;

this.y+=this.vy;



if(this.x<0)this.x=0;

if(this.y<0)this.y=0;


if(this.x>MAP_SIZE)this.x=MAP_SIZE;

if(this.y>MAP_SIZE)this.y=MAP_SIZE;


}



}






class PlayerProfile{


constructor(name,color,isBot=true){


this.name=name;

this.color=color;

this.isBot=isBot;


this.cells=[

new Cell(

Math.random()*MAP_SIZE,

Math.random()*MAP_SIZE,

40,

color,

name,

isBot

)

];



this.botTargetX=Math.random()*MAP_SIZE;

this.botTargetY=Math.random()*MAP_SIZE;

this.botTimer=0;



}






getMass(){


return this.cells.reduce(

(sum,c)=>sum+c.mass,

0

);

}




getCenter(){


let x=0;

let y=0;


this.cells.forEach(c=>{

x+=c.x;

y+=c.y;

});



return{

x:x/this.cells.length,

y:y/this.cells.length

};


}






split(){


let newCells=[];


this.cells.forEach(cell=>{


if(cell.mass>=40 && this.cells.length<16){


cell.mass/=2;



let angle=Math.atan2(

mouse.y,

mouse.x

);



let newCell=new Cell(

cell.x,

cell.y,

cell.mass,

this.color,

this.name,

this.isBot

);



newCell.boostX=Math.cos(angle)*25;

newCell.boostY=Math.sin(angle)*25;

newCell.boostDuration=20;



newCells.push(newCell);



}



});



this.cells=this.cells.concat(newCells);



}






join(){


if(this.cells.length<=1)return;



let mass=0;

let x=0;

let y=0;



this.cells.forEach(c=>{


mass+=c.mass;

x+=c.x;

y+=c.y;


});



x/=this.cells.length;

y/=this.cells.length;



let merged=new Cell(

x,

y,

mass,

this.color,

this.name,

this.isBot

);



merged.canMerge=true;

merged.mergeTimer=0;



this.cells=[merged];



}



shootMass(){


this.cells.forEach(cell=>{


if(cell.mass>35){


cell.mass-=12;


let angle=Math.atan2(
mouse.y,
mouse.x
);



projectiles.push({

x:cell.x,

y:cell.y,

vx:Math.cos(angle)*12,

vy:Math.sin(angle)*12,

radius:10,

damageValue:15,

type:"normal",

owner:this.name,

life:80

});


}


});


}






shootTankOrb(){


this.cells.forEach(cell=>{


if(cell.mass>60){


cell.mass-=30;


let angle=Math.atan2(
mouse.y,
mouse.x
);



projectiles.push({

x:cell.x,

y:cell.y,

vx:Math.cos(angle)*18,

vy:Math.sin(angle)*18,

radius:22,

damageValue:45,

type:"tank",

owner:this.name,

life:100

});


}


});


}







shootHealOrb(){


this.cells.forEach(cell=>{


if(cell.mass>50){


cell.mass-=20;


let angle=Math.atan2(
mouse.y,
mouse.x
);



projectiles.push({

x:cell.x,

y:cell.y,

vx:Math.cos(angle)*15,

vy:Math.sin(angle)*15,

radius:16,

healValue:30,

type:"heal",

owner:this.name,

life:90

});


}


});


}








update(){



if(!this.isBot){



this.cells.forEach(cell=>{


cell.update(

cell.x+mouse.x,

cell.y+mouse.y

);


});



}

else{



this.botTimer--;



if(this.botTimer<=0){


this.botTimer=
Math.random()*120+60;



if(food.length>0){


let target=
food[Math.floor(Math.random()*food.length)];



this.botTargetX=target.x;

this.botTargetY=target.y;


}

else{


this.botTargetX=
Math.random()*MAP_SIZE;


this.botTargetY=
Math.random()*MAP_SIZE;


}


}



this.cells.forEach(cell=>{


cell.update(

this.botTargetX,

this.botTargetY

);


});


}





// stop own cells overlapping too much


for(let i=0;i<this.cells.length;i++){


for(let j=i+1;j<this.cells.length;j++){


let a=this.cells[i];

let b=this.cells[j];


let dx=b.x-a.x;

let dy=b.y-a.y;


let dist=Math.sqrt(dx*dx+dy*dy);


let overlap=
(a.radius+b.radius)-dist;



if(overlap>0){


let angle=Math.atan2(dy,dx);


b.x+=Math.cos(angle)*overlap*.1;

b.y+=Math.sin(angle)*overlap*.1;


}



}



}




}





}









const localPlayer =
new PlayerProfile(
"You",
"#00ffaa",
false
);



players.push(localPlayer);





const botNames=[

"WunWun",
"SirMeow",
"ApexPredator",
"SplitGod",
"Baiter",
"Blobby",
"Doge",
"Jumbo"

];





botNames.forEach(name=>{


players.push(

new PlayerProfile(

name,

`hsl(${Math.random()*360},100%,50%)`,

true

)

);


});





function spawnFood(){


while(food.length<MAX_FOOD){


food.push({

x:Math.random()*MAP_SIZE,

y:Math.random()*MAP_SIZE,

radius:5,

color:

`hsl(${Math.random()*360},80%,60%)`

});


}


}






// ===============================
// CONTROLS
// ===============================


window.addEventListener("mousemove",(e)=>{

mouse.x=e.clientX-canvas.width/2;

mouse.y=e.clientY-canvas.height/2;

});





window.addEventListener("keydown",(e)=>{


if(e.code==="Space")
localPlayer.split();


if(e.code==="KeyJ")
localPlayer.join();


if(e.code==="KeyW")
localPlayer.shootMass();


if(e.code==="KeyG")
localPlayer.shootTankOrb();


if(e.code==="KeyH")
localPlayer.shootHealOrb();


});






function touchMove(e){


if(e.touches.length>0){


let t=e.touches[0];


mouse.x=t.clientX-canvas.width/2;

mouse.y=t.clientY-canvas.height/2;


}


}



window.addEventListener(
"touchmove",
touchMove,
{passive:false}
);







if(
'ontouchstart' in window ||
navigator.maxTouchPoints>0
){


document.getElementById(
"mobile-controls-container"
).style.display="flex";



document.getElementById(
"controls-tip"
).style.display="none";


}






document.getElementById("btn-split")
.addEventListener("touchstart",()=>{

localPlayer.split();

});



document.getElementById("btn-join")
.addEventListener("touchstart",()=>{

localPlayer.join();

});



document.getElementById("btn-shoot")
.addEventListener("touchstart",()=>{

localPlayer.shootMass();

});



document.getElementById("btn-tank")
.addEventListener("touchstart",()=>{

localPlayer.shootTankOrb();

});



document.getElementById("btn-heal")
.addEventListener("touchstart",()=>{

localPlayer.shootHealOrb();

});








// ===============================
// GAME INTERACTIONS
// ===============================



function handleInteractions(){



// projectiles

for(let i=projectiles.length-1;i>=0;i--){


let p=projectiles[i];


p.x+=p.vx;

p.y+=p.vy;


p.life--;



if(p.life<=0){


projectiles.splice(i,1);

continue;


}




players.forEach(player=>{


if(player.name===p.owner)return;



player.cells.forEach(cell=>{


let dx=p.x-cell.x;

let dy=p.y-cell.y;


let dist=Math.sqrt(dx*dx+dy*dy);



if(dist<cell.radius){



if(p.type==="heal"){


cell.mass+=p.healValue;


}


else{


cell.mass-=p.damageValue;



if(cell.mass<10)
cell.mass=10;



}



p.life=0;


}



});



});



}






// eat food


players.forEach(player=>{


player.cells.forEach(cell=>{


for(let i=food.length-1;i>=0;i--){


let f=food[i];


let dx=cell.x-f.x;

let dy=cell.y-f.y;


if(
dx*dx+dy*dy
<
cell.radius*cell.radius
){


food.splice(i,1);

cell.mass++;


}


}


});


});







// player eating


for(let a=0;a<players.length;a++){


for(let b=0;b<players.length;b++){


if(a===b)continue;



let p1=players[a];

let p2=players[b];



p1.cells.forEach(c1=>{


for(let i=p2.cells.length-1;i>=0;i--){


let c2=p2.cells[i];



let dx=c1.x-c2.x;

let dy=c1.y-c2.y;



let dist=Math.sqrt(dx*dx+dy*dy);



if(
c1.mass>c2.mass*1.1 &&
dist<c1.radius
){


c1.mass+=c2.mass;


p2.cells.splice(i,1);


}



}


});



}



}





players.forEach(p=>{


if(p.cells.length===0){


p.cells.push(

new Cell(

Math.random()*MAP_SIZE,

Math.random()*MAP_SIZE,

40,

p.color,

p.name,

p.isBot

)

);


}



});



}








// ===============================
// UI
// ===============================


function updateUI(){


document.getElementById("score")
.innerText=
Math.floor(
localPlayer.getMass()
);



let list=
document.getElementById(
"leaderboardList"
);



list.innerHTML="";



players
.sort(
(a,b)=>b.getMass()-a.getMass()
)
.slice(0,5)
.forEach(p=>{


let li=document.createElement("li");


li.innerText=
p.name+
": "+
Math.floor(p.getMass());


list.appendChild(li);


});


}










// ===============================
// DRAWING
// ===============================


function drawMinimap(){


mctx.clearRect(
0,
0,
150,
150
);



let scale=150/MAP_SIZE;



players.forEach(p=>{


let c=p.getCenter();



mctx.fillStyle=
p.isBot?
"red":
"#00ffaa";



mctx.beginPath();

mctx.arc(

c.x*scale,

c.y*scale,

4,

0,

Math.PI*2

);


mctx.fill();



});


}







function draw(){


ctx.fillStyle="#fafafa";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



let cam=
localPlayer.getCenter();



let ox=
canvas.width/2-cam.x;


let oy=
canvas.height/2-cam.y;



ctx.save();


ctx.translate(
ox,
oy
);






food.forEach(f=>{


ctx.fillStyle=f.color;


ctx.beginPath();

ctx.arc(
f.x,
f.y,
f.radius,
0,
Math.PI*2
);


ctx.fill();



});






players.forEach(player=>{


player.cells.forEach(cell=>{


ctx.fillStyle=cell.color;


ctx.beginPath();


ctx.arc(
cell.x,
cell.y,
cell.radius,
0,
Math.PI*2
);



ctx.fill();



ctx.strokeStyle="#333";


ctx.stroke();



ctx.fillStyle="white";


ctx.font="16px Arial";


ctx.textAlign="center";


ctx.fillText(
cell.parentName,
cell.x,
cell.y
);



});



});






projectiles.forEach(p=>{


ctx.fillStyle=
p.type==="tank"
?"orange"
:
p.type==="heal"
?"cyan"
:
"yellow";



ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.radius,
0,
Math.PI*2
);


ctx.fill();});
ctx.restore();
drawMinimap();
}
// ===============================
// MAIN LOOP
// ===============================
function loop(){
players.forEach(p=>{
p.update();
});
handleInteractions();
spawnFood();
updateUI();
draw();
requestAnimationFrame(loop);
}
spawnFood();
loop();
</script>
</body>
</html>
