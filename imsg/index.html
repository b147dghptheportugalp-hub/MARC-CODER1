<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escord - Web Chat UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #1e1f22; /* Discord Dark */
            color: #dbdee1;
        }

        /* Sidebar (Discord Style) */
        .sidebar {
            width: 250px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e1f22;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 2px solid #1e1f22;
            color: #25d366; /* WhatsApp Green Accent */
        }

        .channel-list {
            list-style: none;
            padding: 10px;
            overflow-y: auto;
        }

        .channel {
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .channel:hover, .channel.active {
            background-color: #404249;
            color: white;
        }

        /* Main Chat Area (WhatsApp Style) */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: #2b2d31;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e1f22;
        }

        .chat-actions button {
            background: none;
            border: none;
            color: #25d366; /* WhatsApp Green */
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: 15px;
            font-weight: bold;
        }

        .chat-actions button:hover {
            color: #128c7e;
        }

        /* Message Display */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Subtle texture */
        }

        .message {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .message.received {
            background-color: #2b2d31;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .message.sent {
            background-color: #005c4b; /* WhatsApp Dark Mode Sent */
            color: white;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .timestamp {
            font-size: 0.75rem;
            color: #949ba4;
            display: block;
            text-align: right;
            margin-top: 5px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background-color: #2b2d31;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background-color: #383a40;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #1da851;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            DisApp Public
        </div>
        <ul class="channel-list">
            <li class="channel active"># general-chat</li>
            <li class="channel"># coding-help</li>
            <li class="channel"># voice-calls</li>
        </ul>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <h2># general-chat</h2>
            <div class="chat-actions">
                <button onclick="alert('Calling feature requires WebRTC backend!')">📞 Call</button>
                <button onclick="alert('Video feature requires WebRTC backend!')">📹 Video</button>
            </div>
        </div>

        <div class="messages" id="messageContainer">
            <div class="message received">
                Hey! Welcome to the new public app.
                <span class="timestamp">10:00 AM</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('messageInput');
            const messageText = inputField.value.trim();

            if (messageText !== "") {
                const messageContainer = document.getElementById('messageContainer');

                // Get current time
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Create new message element
                const newMessage = document.createElement('div');
                newMessage.classList.add('message', 'sent');
                
                newMessage.innerHTML = `
                    ${messageText}
                    <span class="timestamp">${timeString}</span>
                `;

                // Add to chat and scroll to bottom
                messageContainer.appendChild(newMessage);
                messageContainer.scrollTop = messageContainer.scrollHeight;

                // Clear input
                inputField.value = '';
            }
        }

        // Allow sending with the Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
