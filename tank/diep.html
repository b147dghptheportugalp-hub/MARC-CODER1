const MAP_SIZE = 3000;

const MAX_BOTS = 50; // total tanks (incl. player + clones) allowed at once

};


const BOT_PREFIXES=["Vortex","Spectre","Zenith","Quantum","Apex","Matrix","Cipher","Phantom","Gorgon","Hydra","Neon","Glyph","Glitch","Reaper","Omega"];
const BOT_SUFFIXES=["X","Alpha","Zero","Omega","404","Prime","MK_I","Nexus","Void","Fury","V8","Sync","Stryker","Titan"];

function generateBotName(){
let p=BOT_PREFIXES[Math.floor(Math.random()*BOT_PREFIXES.length)];
let s=BOT_SUFFIXES[Math.floor(Math.random()*BOT_SUFFIXES.length)];
let n=Math.floor(Math.random()*900)+100;
return `${p}_${s}_${n}`;
}


// =============================
// TANK CLASS
// =============================


class Tank{


constructor(x,y,isBot=false,name="PLAYER"){


this.x=x;
this.y=y;


this.isBot=isBot;


this.name=isBot ?
generateBotName()
:name;



this.level=1;

this.xp=0;

this.nextXp=50;


this.points=0;



this.skin=TANK_SKINS[1];

this.color=this.skin.body;



this.hp=100;

this.maxHp=100;



this.angle=0;


this.lastShot=0;



this.stats={

speed:0,
reload:0,
bspeed:0,
health:0

};



this.target=null;


this.vx=0;
this.vy=0;


this.actionTimer=0;



this.dashCooldown=0;

this.cloakCooldown=0;

this.cloneCooldown=0;


this.isInvis=false;



this.hasRevive=true;



}




// =============================
// UPDATE
// =============================


update(){



if(this.hp<=0)return;



if(this.dashCooldown>0)
this.dashCooldown--;


if(this.cloakCooldown>0)
this.cloakCooldown--;


if(this.cloneCooldown>0)

this.cloneCooldown--;


if(this.hp<this.maxHp)

this.hp+=0.05;




if(this.isBot)

this.botAI();

else

this.playerMove();



this.shoot();



}





// =============================
// PLAYER MOVEMENT
// =============================


playerMove(){


let speed=3+
(this.stats.speed*.5);



let mx=0;
let my=0;



if(keys["w"]||keys["arrowup"])
my=-1;


if(keys["s"]||keys["arrowdown"])
my=1;


if(keys["a"]||keys["arrowleft"])
mx=-1;


if(keys["d"]||keys["arrowright"])
mx=1;


if(isMobile && touchState.joystick.active){
mx=touchState.joystick.vx;
my=touchState.joystick.vy;
}


this.x+=mx*speed;

this.y+=my*speed;


if(isMobile && touchState.aim.active){
this.angle=Math.atan2(
touchState.aim.y-canvas.height/2,
touchState.aim.x-canvas.width/2
);
}else{
this.angle=Math.atan2(

mouse.y-canvas.height/2,

mouse.x-canvas.width/2

);
}



}



// =============================
// BOT AI
// =============================


botAI(){


this.actionTimer--;


if(this.actionTimer<=0){


this.actionTimer=80;


let a=Math.random()*Math.PI*2;


this.vx=Math.cos(a);

this.vy=Math.sin(a);


}



this.x+=this.vx*2;

this.y+=this.vy*2;



let target=this.findTarget();



if(target){


this.angle=Math.atan2(

target.y-this.y,

target.x-this.x

);


this.target=target;



}


}




findTarget(){


let best=null;

let dist=500;



tanks.forEach(t=>{


if(t!==this && t.hp>0){


let d=Math.hypot(

t.x-this.x,

t.y-this.y

);



if(d<dist){

dist=d;

best=t;

}



}


});


return best;


}






// =============================
// XP + LEVEL SYSTEM
// =============================


addXp(amount){


this.xp+=amount;



if(this.xp>=this.nextXp && this.level<43){


this.xp-=this.nextXp;


this.level++;


this.points++;



this.nextXp=
Math.floor(this.nextXp*1.25+20);



// CHANGE SKIN

this.skin=TANK_SKINS[this.level];

this.color=this.skin.body;



this.maxHp=
100+
(this.level*15);



this.hp=this.maxHp;



if(!this.isBot)

updateUI();



createExplosion(

this.x,

this.y,

this.skin.glow,

30

);



}



}






// =============================
// SHOOTING
// =============================


shoot(){



let canShoot=

this.isBot ?

this.target!=null:

(mouse.down || (isMobile && touchState.aim.active));



if(!canShoot)return;



let delay=
500-
(this.stats.reload*40);



if(Date.now()-this.lastShot<delay)
return;



this.weapon();



this.lastShot=Date.now();



}




// =============================

weapon(){


let lvl=this.level;



// basic placeholder

fireBullet.call(
this,
this.angle,
0
);



}



}




// =============================

// =============================


function fireBullet(angle){


let speed=
8+
(this.stats.bspeed);



bullets.push({

x:this.x,

y:this.y,

vx:Math.cos(angle)*speed,

vy:Math.sin(angle)*speed,


damage:
10+this.level,


size:6,


owner:this,


color:this.skin.glow,


life:100


});


}





// =============================
// CREATE EXPLOSION
// =============================


function createExplosion(x,y,color,count=10){



for(let i=0;i<count;i++){


let a=Math.random()*Math.PI*2;


particles.push({

x:x,

y:y,


vx:Math.cos(a)*3,

vy:Math.sin(a)*3,


size:Math.random()*5+2,


life:30,


color:color


});


}


}

"ice"
);

// MAGMA

else if(lvl===32){

this.fireAdvancedBullet(
this.angle,
100,
35,
false,
"magma"
);

// TORNADO

this.fireAdvancedBullet(
this.angle,
30,
25,
false,
"tornado"
);

// ECHO

else if(lvl===34){

this.fireAdvancedBullet(
this.angle,
60,

false,
"echo"
);


}



// BARRAGE

else if(lvl===35){

for(let i=0;i<6;i++)

this.fireAdvancedBullet(
this.angle+Math.random()-.5,
25
);


}



// GUARDIAN

else if(lvl===36){

this.maintainDrones();

}



// PULSE BEAM

this.fireAdvancedBullet(
this.angle,
120,

true
);

this.angle,
50,
25,
false,

);

// MIRAGE

else if(lvl===39){

if(this.cloneCooldown<=0){

let myClones=tanks.filter(t=>t.isBot && t!==this && t.level===39 && Math.hypot(t.x-this.x,t.y-this.y)<200);

if(myClones.length<12 && tanks.length<MAX_BOTS){

}

}

// BLITZ

else if(lvl===40){

else if(lvl===43){

};





// =====================================
// MAINTAIN DRONES
// =====================================

Tank.prototype.maintainDrones=function(){

if(drones.length>=MAX_TOTAL_DRONES)return;

let maxDrones=3+Math.floor(this.level/5);

let myDrones=drones.filter(d=>d.owner===this);

if(myDrones.length<maxDrones){

drones.push({
x:this.x+Math.random()*50-25,
y:this.y+Math.random()*50-25,
owner:this,
angle:Math.random()*Math.PI*2,
life:Infinity
});
}

};



// =====================================
// BULLET CREATION
// =====================================


Tank.prototype.fireAdvancedBullet=function(
angle,
damage=10,
size=8,
pierce=false,
type=""
){


let speed=8;



bullets.push({

x:this.x,

y:this.y,


vx:Math.cos(angle)*speed,

vy:Math.sin(angle)*speed,


damage:damage,

size:size,


owner:this,


life:100,


type:type,


pierce:pierce,


color:this.skin.glow



});


};



// =====================================
// RENDERING + GAME LOOP
// =====================================



function drawTank(t,camX,camY){


ctx.save();



let x=t.x-camX;

let y=t.y-camY;



ctx.shadowBlur=25;

ctx.shadowColor=t.skin.glow;



// tank body

ctx.fillStyle=t.skin.body;

ctx.beginPath();

ctx.arc(
x,
y,
25,
0,
Math.PI*2
);

ctx.fill();



// outline

ctx.strokeStyle="#ffffff";

ctx.lineWidth=3;

ctx.stroke();





// barrel


ctx.save();

ctx.translate(x,y);

ctx.rotate(t.angle);


ctx.fillStyle=t.skin.glow;


ctx.fillRect(
0,
-6,
45,
12
);


ctx.restore();





// level text


ctx.shadowBlur=0;


ctx.fillStyle="white";

ctx.font="12px monospace";

ctx.textAlign="center";


ctx.fillText(

t.name+" LV"+t.level,

x,

y-40

);





// hp bar


ctx.fillStyle="#222";

ctx.fillRect(

x-25,

y-32,

50,

5

);



ctx.fillStyle=t.skin.glow;


ctx.fillRect(

x-25,

y-32,

50*(t.hp/t.maxHp),

5

);




ctx.restore();


}





// =====================================
// OBJECT SPAWNING
// =====================================


function spawnShapes(){


while(shapes.length<120){



let size=
Math.random()*20+10;



shapes.push({

x:Math.random()*MAP_SIZE,

y:Math.random()*MAP_SIZE,


size:size,


hp:size*3,


xp:
Math.floor(size*5),


color:

size>25?

"#00ffff":

"#ff00ff"


});


}



}






// =====================================
// BOTS
// =====================================


function spawnBots(){

if(Date.now()-lastBotSpawn<500)return;

lastBotSpawn=Date.now();


while(tanks.length<MAX_BOTS){


let pos=findSpreadSpawnPoint();

let bot=new Tank(

pos.x,

pos.y,

true

);


let maxLevel=Math.min(20,playerObj.level);

bot.level=
Math.floor(Math.random()*maxLevel)+1;


bot.skin=
TANK_SKINS[bot.level];


bot.color=
bot.skin.body;



bot.maxHp=
100+
bot.level*15;


bot.hp=
bot.maxHp;



tanks.push(bot);


}



}

// Tries a handful of random points and picks the one furthest from
// existing tanks, so new bots don't spawn on top of each other.
function findSpreadSpawnPoint(){

let best=null, bestDist=-1;

for(let attempt=0; attempt<8; attempt++){

let cx=Math.random()*MAP_SIZE;

let cy=Math.random()*MAP_SIZE;

let nearestDist=Infinity;

for(let t of tanks){

let d=Math.hypot(t.x-cx, t.y-cy);

if(d<nearestDist) nearestDist=d;

}

if(nearestDist>=MIN_SPAWN_DIST) return {x:cx, y:cy};

if(nearestDist>bestDist){ bestDist=nearestDist; best={x:cx, y:cy}; }

}

return best || {x:Math.random()*MAP_SIZE, y:Math.random()*MAP_SIZE};

}











// =====================================
// BULLET UPDATE
// =====================================


function updateBullets(camX,camY){



for(let i=bullets.length-1;i>=0;i--){


let b=bullets[i];

let bulletRemoved=false;


b.x+=b.vx;

b.y+=b.vy;



b.life--;





ctx.shadowBlur=15;

ctx.shadowColor=b.color;


ctx.fillStyle=b.color;


ctx.beginPath();


ctx.arc(

b.x-camX,

b.y-camY,

b.size,

0,

Math.PI*2

);


ctx.fill();


ctx.shadowBlur=0;





// hit objects


for(let j=shapes.length-1;j>=0;j--){


let s=shapes[j];



if(Math.hypot(
b.x-s.x,
b.y-s.y
)
<s.size+b.size){



s.hp-=b.damage;



createExplosion(
s.x,
s.y,
s.color,
5
);



if(s.hp<=0){


b.owner.addXp(
s.xp
);



shapes.splice(j,1);



}



if(!b.pierce){

bullets.splice(i,1);

bulletRemoved=true;

break;

}



}




}

if(bulletRemoved)continue;




// hit tanks


for(let j=tanks.length-1;j>=0;j--){

let t=tanks[j];



if(
t!==b.owner &&
t.hp>0
){



if(Math.hypot(
b.x-t.x,
b.y-t.y
)
<30+b.size){



t.hp-=b.damage;



createExplosion(
t.x,
t.y,
t.skin.glow,
8
);



if(t.hp<=0){



b.owner.addXp(
t.level*50
);

if(t===playerObj){
playerObj=new Tank(MAP_SIZE/2,MAP_SIZE/2,false,"NEXUS_CORE");
tanks[j]=playerObj;
}else{
tanks.splice(j,1);
}

}



if(!b.pierce){


bullets.splice(i,1);

bulletRemoved=true;

break;


}




}



}



}

if(!bulletRemoved && b.life<=0)

bullets.splice(i,1);



}



}








// =====================================
// PARTICLES
// =====================================


function updateParticles(camX,camY){


for(let i=particles.length-1;i>=0;i--){



let p=particles[i];


p.x+=p.vx;

p.y+=p.vy;


p.life--;



ctx.fillStyle=p.color;


ctx.fillRect(

p.x-camX,

p.y-camY,

p.size,

p.size

);



if(p.life<=0)

particles.splice(i,1);



}



}

// =====================================
// MOBILE TOUCH SUPPORT
// =====================================

window.addEventListener("touchstart",(e)=>{
e.preventDefault();
isMobile=true;

for(let i=0;i<e.changedTouches.length;i++){
let touch=e.changedTouches[i];

if(touch.clientX<canvas.width/2 && !touchState.joystick.active){
touchState.joystick.active=true;
touchState.joystick.startX=touch.clientX;
touchState.joystick.startY=touch.clientY;
touchState.joystick.curX=touch.clientX;
touchState.joystick.curY=touch.clientY;
touchState.joystick.id=touch.identifier;
}else if(touch.clientX>=canvas.width/2 && !touchState.aim.active){
touchState.aim.active=true;
touchState.aim.x=touch.clientX;
touchState.aim.y=touch.clientY;
touchState.aim.id=touch.identifier;
}
}
},{passive:false});

window.addEventListener("touchmove",(e)=>{
e.preventDefault();

for(let i=0;i<e.touches.length;i++){
let touch=e.touches[i];

if(touchState.joystick.active && touch.identifier===touchState.joystick.id){
touchState.joystick.curX=touch.clientX;
touchState.joystick.curY=touch.clientY;
let dx=touchState.joystick.curX-touchState.joystick.startX;
let dy=touchState.joystick.curY-touchState.joystick.startY;
let dist=Math.hypot(dx,dy);
if(dist>50){dx=(dx/dist)*50;dy=(dy/dist)*50;}
touchState.joystick.vx=dx/50;
touchState.joystick.vy=dy/50;
}else if(touchState.aim.active && touch.identifier===touchState.aim.id){
touchState.aim.x=touch.clientX;
touchState.aim.y=touch.clientY;
}
}
},{passive:false});

window.addEventListener("touchend",(e)=>{
e.preventDefault();

for(let i=0;i<e.changedTouches.length;i++){
let touch=e.changedTouches[i];

if(touchState.joystick.active && touch.identifier===touchState.joystick.id){
touchState.joystick.active=false;
touchState.joystick.vx=0;
touchState.joystick.vy=0;
touchState.joystick.id=null;
}else if(touchState.aim.active && touch.identifier===touchState.aim.id){
touchState.aim.active=false;
touchState.aim.id=null;
}
}
},{passive:false});







// =====================================
// ABILITIES
// =====================================



function triggerInvis(){

if(!playerObj)return;

playerObj.isInvis=
!playerObj.isInvis;


}





function triggerDash(){

if(!playerObj)return;

if(playerObj.dashCooldown>0)
return;



playerObj.x+=
Math.cos(playerObj.angle)*150;



playerObj.y+=
Math.sin(playerObj.angle)*150;



playerObj.dashCooldown=120;



createExplosion(

playerObj.x,

playerObj.y,

"#ffff00",

20

);



}









// =====================================
// UPGRADE SYSTEM
// =====================================



function upgradeStat(stat){

if(!playerObj)return;

if(playerObj.points<=0)
return;



if(playerObj.stats[stat]>=7)
return;



playerObj.stats[stat]++;

playerObj.points--;



updateUI();


}








// =====================================
// MAIN LOOP
// =====================================



function loop(){



ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



spawnShapes();

spawnBots();



let camX=0;

let camY=0;

if(playerObj){

camX=
playerObj.x-
canvas.width/2;

camY=
playerObj.y-
canvas.height/2;

}





// grid


ctx.strokeStyle="#182033";


for(
let x=-camX%50;
x<canvas.width;
x+=50
){


ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,canvas.height);

ctx.stroke();


}




for(
let y=-camY%50;
y<canvas.height;
y+=50
){


ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(canvas.width,y);

ctx.stroke();


}





// update tanks


for(let i=tanks.length-1;i>=0;i--){

if(tanks[i])tanks[i].update();

}





// draw objects


for(let s of shapes){



ctx.fillStyle=s.color;


ctx.beginPath();


ctx.arc(

s.x-camX,

s.y-camY,

s.size,

0,

Math.PI*2

);


ctx.fill();


}





// draw tanks


for(let i=0;i<tanks.length;i++){

let t=tanks[i];

if(t && t.hp>0)

drawTank(
t,
camX,
camY
);

}






updateBullets(camX,camY);


updateParticles(camX,camY);



updateUI();

// Mobile UI handling
if(isMobile){
document.getElementById('mobile-buttons').style.display='flex';
document.getElementById('joystick-visual').style.display='block';

if(touchState.joystick.active){
let visual=document.getElementById('joystick-visual');
let offsetX=touchState.joystick.vx*30;
let offsetY=touchState.joystick.vy*30;
visual.style.setProperty('--offset-x',offsetX+'px');
visual.style.setProperty('--offset-y',offsetY+'px');
visual.style.transform=`translate(${offsetX}px,${offsetY}px)`;
}
}else{
document.getElementById('mobile-buttons').style.display='none';
document.getElementById('joystick-visual').style.display='none';
}

requestAnimationFrame(loop);


}





updateUI();

loop();



</script>
