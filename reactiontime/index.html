<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time Test</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

#game{
    width:500px;
}

#box{
    margin-top:20px;
    width:100%;
    height:300px;
    background:#444;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    border-radius:15px;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

button{
    padding:12px 24px;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="game">

<h1>⚡ Reaction Time Test</h1>

<p>Click Start, then wait for the box to turn green.</p>

<button id="start">Start</button>

<div id="box">
Press Start
</div>

<h2 id="result"></h2>

</div>

<script>

const box=document.getElementById("box");
const start=document.getElementById("start");
const result=document.getElementById("result");

let startTime=0;
let canClick=false;
let timer;

start.onclick=function(){

    clearTimeout(timer);

    result.textContent="";

    canClick=false;

    box.style.background="#cc3333";
    box.textContent="Wait...";

    const delay=Math.random()*4000+1000;

    timer=setTimeout(()=>{

        box.style.background="#22aa22";
        box.textContent="CLICK!";
        startTime=Date.now();
        canClick=true;

    },delay);

}

box.onclick=function(){

    if(!canClick){

        result.textContent="❌ Too Soon!";
        return;

    }

    const reaction=Date.now()-startTime;

    result.textContent="⚡ "+reaction+" ms";

    canClick=false;

    box.style.background="#444";
    box.textContent="Press Start";

}

</script>

</body>
</html>
